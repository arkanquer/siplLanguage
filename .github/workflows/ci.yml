name: SIPL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff mypy build setuptools wheel

      - name: Check code with Ruff
        run: ruff check --select E4,E7,E9,F821,F822,F823 src tests conformance

      - name: Check types with mypy
        run: mypy --follow-imports=silent --ignore-missing-imports src/sipl/ast.py src/sipl/trace.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run conformance suite
        run: python conformance/run_suite.py

      - name: Build package
        run: python -m build